<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Employee Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* Route transitions */
    .fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }

    /* Toast slide up */
    .toast-enter-active { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .toast-leave-active { transition: all 0.2s ease-in; }
    .toast-enter-from { transform: translateX(-50%) translateY(20px); opacity: 0; }
    .toast-leave-to { transform: translateX(-50%) translateY(20px); opacity: 0; }

    /* Modal */
    .modal-enter-active { transition: all 0.25s ease-out; }
    .modal-leave-active { transition: all 0.2s ease-in; }
    .modal-enter-from, .modal-leave-to { opacity: 0; }
    .modal-enter-from .modal-box { transform: scale(0.95) translateY(10px); }

    /* Card hover */
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 12px 30px -8px rgba(79,70,229,0.15); }

    /* Avatar gradients (10 options) */
    .av0 { background: linear-gradient(135deg, #667eea, #764ba2); }
    .av1 { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .av2 { background: linear-gradient(135deg, #4facfe, #00f2fe); }
    .av3 { background: linear-gradient(135deg, #43e97b, #38f9d7); }
    .av4 { background: linear-gradient(135deg, #fa709a, #fee140); }
    .av5 { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
    .av6 { background: linear-gradient(135deg, #fd7043, #ff8a65); }
    .av7 { background: linear-gradient(135deg, #26c6da, #00acc1); }
    .av8 { background: linear-gradient(135deg, #66bb6a, #43a047); }
    .av9 { background: linear-gradient(135deg, #ab47bc, #8e24aa); }

    /* Safe area for iOS */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    /* Focus ring */
    input:focus, button:focus { outline: none; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="app"></div>

  <!-- TCB SDK -->
  <script src="https://cdn.jsdelivr.net/npm/tcb-js-sdk@1.3.5/dist/index.umd.js"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3.4.15/dist/vue.global.prod.js"></script>
  <!-- Vue Router 4 -->
  <script src="https://unpkg.com/vue-router@4.2.5/dist/vue-router.global.prod.js"></script>

  <script>
    const { createApp, ref, reactive, computed, watch, onMounted } = Vue;
    const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

    // ═══════════════════════════════════════════════════
    //  TCB Cloud Backend
    // ═══════════════════════════════════════════════════
    let _tcbApp = null;
    let _tcbAuth = null;

    try {
      _tcbApp = tcb.init({ env: 'test-1d173d' });
      _tcbAuth = _tcbApp.auth();
    } catch (e) {
      console.warn('TCB init failed:', e);
    }

    async function getTCB() {
      if (!_tcbApp) throw new Error('TCB not initialized');
      if (_tcbAuth) await _tcbAuth.signInAnonymously();
      return _tcbApp;
    }

    // ═══════════════════════════════════════════════════
    //  Global UI State
    // ═══════════════════════════════════════════════════
    const toast = reactive({ show: false, msg: '', type: 'success' });
    let toastTimer = null;
    function showToast(msg, type = 'success') {
      if (toastTimer) clearTimeout(toastTimer);
      Object.assign(toast, { show: true, msg, type });
      toastTimer = setTimeout(() => { toast.show = false; }, 3000);
    }

    const modal = reactive({ show: false, msg: '', resolve: null });
    function confirm(msg) {
      return new Promise(resolve => { Object.assign(modal, { show: true, msg, resolve }); });
    }

    // ═══════════════════════════════════════════════════
    //  Helpers
    // ═══════════════════════════════════════════════════
    function avatarClass(name) {
      if (!name) return 'av0';
      return 'av' + (name.charCodeAt(0) % 10);
    }
    function initials(name) {
      if (!name) return '?';
      const s = name.trim();
      if (/[\u4e00-\u9fa5]/.test(s)) return s.substring(0, 2);
      const parts = s.split(' ').filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return s.substring(0, 2).toUpperCase();
    }

    // ═══════════════════════════════════════════════════
    //  Toast Component
    // ═══════════════════════════════════════════════════
    const Toast = {
      setup() { return { toast }; },
      template: `
        <transition name="toast">
          <div v-if="toast.show"
            :class="[
              'fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full shadow-xl flex items-center gap-2.5 text-white text-sm font-medium whitespace-nowrap',
              toast.type === 'success' ? 'bg-emerald-500' : toast.type === 'error' ? 'bg-rose-500' : 'bg-blue-500'
            ]">
            <i :class="['text-base', toast.type === 'success' ? 'fas fa-check-circle' : toast.type === 'error' ? 'fas fa-times-circle' : 'fas fa-info-circle']"></i>
            {{ toast.msg }}
          </div>
        </transition>
      `
    };

    // ═══════════════════════════════════════════════════
    //  Confirm Modal
    // ═══════════════════════════════════════════════════
    const ConfirmModal = {
      setup() {
        function ok()     { modal.show = false; modal.resolve(true);  }
        function cancel() { modal.show = false; modal.resolve(false); }
        return { modal, ok, cancel };
      },
      template: `
        <transition name="modal">
          <div v-if="modal.show" class="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="cancel"></div>
            <div class="modal-box relative bg-white rounded-3xl shadow-2xl p-7 w-full max-w-sm">
              <div class="text-center mb-6">
                <div class="w-14 h-14 bg-rose-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                  <i class="fas fa-trash-alt text-rose-500 text-xl"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-900">确认删除</h3>
                <p class="text-gray-500 text-sm mt-1.5">{{ modal.msg }}</p>
              </div>
              <div class="flex gap-3">
                <button @click="cancel"
                  class="flex-1 py-3 rounded-xl border border-gray-200 text-gray-700 text-sm font-semibold hover:bg-gray-50 transition-colors">
                  取消
                </button>
                <button @click="ok"
                  class="flex-1 py-3 rounded-xl bg-rose-500 text-white text-sm font-semibold hover:bg-rose-600 transition-colors">
                  确认删除
                </button>
              </div>
            </div>
          </div>
        </transition>
      `
    };

    // ═══════════════════════════════════════════════════
    //  Spinner
    // ═══════════════════════════════════════════════════
    const Spinner = {
      template: `
        <div class="flex flex-col items-center justify-center py-24 gap-4">
          <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full spin"></div>
          <span class="text-slate-400 text-sm">加载中…</span>
        </div>
      `
    };

    // ═══════════════════════════════════════════════════
    //  Navbar
    // ═══════════════════════════════════════════════════
    const Navbar = {
      template: `
        <header class="bg-gradient-to-r from-indigo-600 via-violet-600 to-purple-600 shadow-lg shadow-indigo-500/20 sticky top-0 z-30">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <!-- Logo -->
            <router-link to="/" class="flex items-center gap-2.5 text-white">
              <div class="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur">
                <i class="fas fa-users text-sm"></i>
              </div>
              <span class="font-bold text-base tracking-tight">Employee Manager</span>
            </router-link>
            <!-- Desktop nav -->
            <nav class="hidden md:flex items-center gap-1">
              <router-link to="/"
                exact-active-class="bg-white/20 text-white"
                class="flex items-center gap-1.5 text-white/75 hover:text-white hover:bg-white/15 px-3.5 py-2 rounded-xl text-sm font-medium transition-all">
                <i class="fas fa-th-large text-xs"></i> 员工列表
              </router-link>
              <router-link to="/new"
                active-class="bg-white/20 text-white"
                class="flex items-center gap-1.5 text-white/75 hover:text-white hover:bg-white/15 px-3.5 py-2 rounded-xl text-sm font-medium transition-all">
                <i class="fas fa-user-plus text-xs"></i> 添加员工
              </router-link>
            </nav>
          </div>
        </header>
      `
    };

    // ═══════════════════════════════════════════════════
    //  Bottom Navigation (mobile only)
    // ═══════════════════════════════════════════════════
    const BottomNav = {
      template: `
        <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur border-t border-slate-100 md:hidden z-30 safe-bottom">
          <div class="flex h-16">
            <router-link to="/"
              exact-active-class="text-indigo-600"
              class="flex-1 flex flex-col items-center justify-center gap-0.5 text-slate-400 transition-colors">
              <i class="fas fa-th-large text-lg"></i>
              <span class="text-[10px] font-medium">员工</span>
            </router-link>
            <router-link to="/new"
              active-class="text-indigo-600"
              class="flex-1 flex flex-col items-center justify-center gap-0.5 text-slate-400 transition-colors">
              <i class="fas fa-user-plus text-lg"></i>
              <span class="text-[10px] font-medium">添加</span>
            </router-link>
          </div>
        </nav>
      `
    };

    // ═══════════════════════════════════════════════════
    //  Dashboard
    // ═══════════════════════════════════════════════════
    const Dashboard = {
      components: { Spinner },
      setup() {
        const employees = ref([]);
        const loading = ref(true);
        const search = ref('');

        const filtered = computed(() => {
          const q = search.value.toLowerCase();
          if (!q) return employees.value;
          return employees.value.filter(e =>
            (e.name || '').toLowerCase().includes(q) ||
            (e.dept || '').toLowerCase().includes(q) ||
            (e.employee_id || '').toLowerCase().includes(q) ||
            (e.position || '').toLowerCase().includes(q)
          );
        });

        onMounted(async () => {
          try {
            const app = await getTCB();
            const res = await app.database().collection('employees').get();
            employees.value = res.data.map(e => ({
              id: e._id,
              employee_id: e.employee_id,
              name: e.name,
              dept: e.dept,
              position: e.position
            }));
          } catch (e) {
            console.error(e);
            showToast('加载数据失败', 'error');
          } finally {
            loading.value = false;
          }
        });

        return { employees, loading, search, filtered, avatarClass, initials };
      },
      template: `
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6">

          <!-- Page header -->
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">员工列表</h1>
              <p class="text-slate-400 text-sm mt-0.5">共 <span class="font-semibold text-indigo-600">{{ filtered.length }}</span> 名员工</p>
            </div>
            <!-- Search -->
            <div class="relative">
              <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <input v-model="search" type="text" placeholder="搜索姓名、部门、职位…"
                class="pl-9 pr-4 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm shadow-sm
                       focus:ring-2 focus:ring-indigo-500 focus:border-transparent w-full sm:w-64 transition-shadow">
            </div>
          </div>

          <!-- Loading -->
          <Spinner v-if="loading" />

          <!-- Empty state -->
          <div v-else-if="filtered.length === 0" class="text-center py-24">
            <div class="w-16 h-16 bg-slate-100 rounded-3xl flex items-center justify-center mx-auto mb-4">
              <i class="fas fa-users text-slate-300 text-2xl"></i>
            </div>
            <p class="text-slate-600 font-semibold">{{ search ? '未找到匹配员工' : '暂无员工数据' }}</p>
            <p class="text-slate-400 text-sm mt-1">{{ search ? '换个关键词试试' : '点击右下角 + 添加第一名员工' }}</p>
          </div>

          <!-- Grid -->
          <div v-else class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <router-link
              v-for="emp in filtered" :key="emp.id"
              :to="{ name: 'view-employee', params: { employee_id: emp.employee_id } }"
              class="block group">
              <div class="bg-white rounded-2xl border border-slate-100 p-5 card-hover cursor-pointer">
                <div class="flex items-center gap-3 mb-4">
                  <!-- Avatar -->
                  <div :class="['w-11 h-11 rounded-xl flex items-center justify-center text-white font-bold text-sm flex-shrink-0', avatarClass(emp.name)]">
                    {{ initials(emp.name) }}
                  </div>
                  <div class="flex-1 min-w-0">
                    <p class="font-semibold text-slate-900 truncate leading-tight">{{ emp.name || '未知姓名' }}</p>
                    <p class="text-slate-400 text-xs truncate mt-0.5">{{ emp.position || '未设置职位' }}</p>
                  </div>
                  <i class="fas fa-chevron-right text-slate-200 group-hover:text-indigo-400 transition-colors text-sm flex-shrink-0"></i>
                </div>
                <div class="flex items-center justify-between">
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-medium">
                    <i class="fas fa-building text-indigo-400 text-[10px]"></i>
                    {{ emp.dept || '未知部门' }}
                  </span>
                  <span class="text-slate-300 text-xs font-mono">#{{ emp.employee_id }}</span>
                </div>
              </div>
            </router-link>
          </div>

          <!-- FAB -->
          <router-link to="/new"
            class="fixed bottom-20 md:bottom-8 right-5 md:right-8 w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-2xl shadow-lg shadow-indigo-500/30 flex items-center justify-center hover:scale-105 hover:shadow-xl hover:shadow-indigo-500/40 transition-all">
            <i class="fas fa-plus text-xl"></i>
          </router-link>
        </div>
      `
    };

    // ═══════════════════════════════════════════════════
    //  New Employee
    // ═══════════════════════════════════════════════════
    const NewEmployee = {
      setup() {
        const router = useRouter();
        const form = reactive({ employee_id: '', name: '', dept: '', position: '' });
        const saving = ref(false);
        const errors = reactive({});

        function validate() {
          for (const k in errors) delete errors[k];
          if (!form.employee_id.trim()) errors.employee_id = '请输入员工 ID';
          if (!form.name.trim())        errors.name        = '请输入姓名';
          if (!form.dept.trim())        errors.dept        = '请输入部门';
          return Object.keys(errors).length === 0;
        }

        async function submit() {
          if (!validate()) return;
          saving.value = true;
          try {
            const app = await getTCB();
            await app.database().collection('employees').add({
              employee_id: form.employee_id.trim(),
              name:        form.name.trim(),
              dept:        form.dept.trim(),
              position:    form.position.trim()
            });
            showToast('员工添加成功', 'success');
            router.push('/');
          } catch (e) {
            console.error(e);
            showToast('添加失败，请重试', 'error');
          } finally {
            saving.value = false;
          }
        }

        return { form, saving, errors, submit };
      },
      template: `
        <div class="max-w-2xl mx-auto px-4 sm:px-6 py-6">
          <router-link to="/" class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-700 mb-6 group text-sm font-medium">
            <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
            返回列表
          </router-link>

          <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 sm:p-8">
            <div class="flex items-center gap-3 mb-8">
              <div class="w-11 h-11 bg-indigo-100 rounded-2xl flex items-center justify-center flex-shrink-0">
                <i class="fas fa-user-plus text-indigo-600"></i>
              </div>
              <div>
                <h1 class="text-xl font-bold text-slate-900">添加新员工</h1>
                <p class="text-slate-400 text-sm">填写以下信息完成添加</p>
              </div>
            </div>

            <form @submit.prevent="submit" class="space-y-5">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    员工 ID <span class="text-rose-500">*</span>
                  </label>
                  <input v-model="form.employee_id" type="text" placeholder="如: EMP001"
                    :class="['w-full px-4 py-3 rounded-xl border text-sm transition-all',
                      errors.employee_id
                        ? 'border-rose-300 bg-rose-50 focus:ring-2 focus:ring-rose-400'
                        : 'border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent']">
                  <p v-if="errors.employee_id" class="text-rose-500 text-xs mt-1.5 flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> {{ errors.employee_id }}
                  </p>
                </div>
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    姓名 <span class="text-rose-500">*</span>
                  </label>
                  <input v-model="form.name" type="text" placeholder="如: 张三"
                    :class="['w-full px-4 py-3 rounded-xl border text-sm transition-all',
                      errors.name
                        ? 'border-rose-300 bg-rose-50 focus:ring-2 focus:ring-rose-400'
                        : 'border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent']">
                  <p v-if="errors.name" class="text-rose-500 text-xs mt-1.5 flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> {{ errors.name }}
                  </p>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    部门 <span class="text-rose-500">*</span>
                  </label>
                  <input v-model="form.dept" type="text" placeholder="如: 研发部"
                    :class="['w-full px-4 py-3 rounded-xl border text-sm transition-all',
                      errors.dept
                        ? 'border-rose-300 bg-rose-50 focus:ring-2 focus:ring-rose-400'
                        : 'border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent']">
                  <p v-if="errors.dept" class="text-rose-500 text-xs mt-1.5 flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> {{ errors.dept }}
                  </p>
                </div>
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-1.5">职位</label>
                  <input v-model="form.position" type="text" placeholder="如: 高级工程师"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>
              </div>

              <div class="flex gap-3 pt-2">
                <router-link to="/"
                  class="flex-1 sm:flex-none px-6 py-3 rounded-xl border border-slate-200 text-slate-700 text-sm font-semibold hover:bg-slate-50 transition-colors text-center">
                  取消
                </router-link>
                <button type="submit" :disabled="saving"
                  class="flex-1 sm:flex-none px-8 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-sm font-semibold hover:opacity-90 disabled:opacity-60 flex items-center justify-center gap-2 transition-opacity shadow-md shadow-indigo-500/20">
                  <div v-if="saving" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full spin"></div>
                  {{ saving ? '保存中…' : '保存员工' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      `
    };

    // ═══════════════════════════════════════════════════
    //  View Employee
    // ═══════════════════════════════════════════════════
    const ViewEmployee = {
      setup() {
        const route = useRoute();
        const router = useRouter();
        const emp = reactive({ employee_id: '', name: '', dept: '', position: '' });
        const loading = ref(true);

        async function fetchData(id) {
          loading.value = true;
          try {
            const app = await getTCB();
            const res = await app.database().collection('employees').where({ employee_id: id }).get();
            if (res.data.length > 0) {
              const e = res.data[0];
              Object.assign(emp, { employee_id: e.employee_id, name: e.name, dept: e.dept, position: e.position });
            }
          } catch (e) {
            console.error(e);
            showToast('加载详情失败', 'error');
          } finally {
            loading.value = false;
          }
        }

        watch(() => route.params.employee_id, id => { if (id) fetchData(id); });
        onMounted(() => fetchData(route.params.employee_id));

        async function del() {
          const ok = await confirm('此操作将永久删除该员工，无法撤销。');
          if (!ok) return;
          try {
            const app = await getTCB();
            await app.database().collection('employees').where({ employee_id: route.params.employee_id }).remove();
            showToast('员工已删除', 'success');
            router.push('/');
          } catch (e) {
            console.error(e);
            showToast('删除失败，请重试', 'error');
          }
        }

        return { emp, loading, del, avatarClass, initials };
      },
      template: `
        <div class="max-w-2xl mx-auto px-4 sm:px-6 py-6">
          <router-link to="/" class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-700 mb-6 group text-sm font-medium">
            <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
            返回列表
          </router-link>

          <div v-if="loading" class="flex justify-center py-24">
            <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full spin"></div>
          </div>

          <div v-else class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
            <!-- Profile header -->
            <div class="bg-gradient-to-br from-indigo-500 via-violet-500 to-purple-600 px-8 pt-10 pb-12 text-center relative">
              <div :class="['w-20 h-20 rounded-2xl flex items-center justify-center text-white font-bold text-xl mx-auto shadow-xl', avatarClass(emp.name)]">
                {{ initials(emp.name) }}
              </div>
              <h1 class="text-white font-bold text-xl mt-4">{{ emp.name || '未知姓名' }}</h1>
              <p class="text-white/70 text-sm mt-1">{{ emp.position || '未设置职位' }}</p>
            </div>

            <!-- Details -->
            <div class="p-6 -mt-6">
              <div class="bg-white rounded-2xl shadow-sm border border-slate-100 divide-y divide-slate-50">
                <div class="flex items-center gap-4 p-4">
                  <div class="w-9 h-9 bg-indigo-50 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-id-badge text-indigo-500 text-sm"></i>
                  </div>
                  <div>
                    <p class="text-slate-400 text-xs font-medium uppercase tracking-wider">员工 ID</p>
                    <p class="text-slate-900 font-semibold text-sm mt-0.5">{{ emp.employee_id || '—' }}</p>
                  </div>
                </div>
                <div class="flex items-center gap-4 p-4">
                  <div class="w-9 h-9 bg-violet-50 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-building text-violet-500 text-sm"></i>
                  </div>
                  <div>
                    <p class="text-slate-400 text-xs font-medium uppercase tracking-wider">部门</p>
                    <p class="text-slate-900 font-semibold text-sm mt-0.5">{{ emp.dept || '—' }}</p>
                  </div>
                </div>
                <div class="flex items-center gap-4 p-4">
                  <div class="w-9 h-9 bg-purple-50 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-briefcase text-purple-500 text-sm"></i>
                  </div>
                  <div>
                    <p class="text-slate-400 text-xs font-medium uppercase tracking-wider">职位</p>
                    <p class="text-slate-900 font-semibold text-sm mt-0.5">{{ emp.position || '—' }}</p>
                  </div>
                </div>
              </div>

              <!-- Actions -->
              <div class="flex gap-3 mt-5">
                <router-link :to="{ name: 'edit-employee', params: { employee_id: emp.employee_id } }"
                  class="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl bg-indigo-50 text-indigo-700 text-sm font-semibold hover:bg-indigo-100 transition-colors">
                  <i class="fas fa-pen"></i> 编辑信息
                </router-link>
                <button @click="del"
                  class="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl bg-rose-50 text-rose-600 text-sm font-semibold hover:bg-rose-100 transition-colors">
                  <i class="fas fa-trash-alt"></i> 删除员工
                </button>
              </div>
            </div>
          </div>
        </div>
      `
    };

    // ═══════════════════════════════════════════════════
    //  Edit Employee
    // ═══════════════════════════════════════════════════
    const EditEmployee = {
      setup() {
        const route = useRoute();
        const router = useRouter();
        const form = reactive({ employee_id: '', name: '', dept: '', position: '' });
        const loading = ref(true);
        const saving = ref(false);
        const errors = reactive({});

        onMounted(async () => {
          try {
            const app = await getTCB();
            const res = await app.database().collection('employees').where({ employee_id: route.params.employee_id }).get();
            if (res.data.length > 0) {
              const e = res.data[0];
              Object.assign(form, { employee_id: e.employee_id, name: e.name, dept: e.dept, position: e.position });
            }
          } catch (e) {
            console.error(e);
            showToast('加载数据失败', 'error');
          } finally {
            loading.value = false;
          }
        });

        function validate() {
          for (const k in errors) delete errors[k];
          if (!form.name.trim()) errors.name = '请输入姓名';
          if (!form.dept.trim()) errors.dept = '请输入部门';
          return Object.keys(errors).length === 0;
        }

        async function submit() {
          if (!validate()) return;
          saving.value = true;
          try {
            const app = await getTCB();
            await app.database().collection('employees')
              .where({ employee_id: form.employee_id })
              .update({ name: form.name.trim(), dept: form.dept.trim(), position: form.position.trim() });
            showToast('员工信息已更新', 'success');
            router.push('/' + form.employee_id);
          } catch (e) {
            console.error(e);
            showToast('保存失败，请重试', 'error');
          } finally {
            saving.value = false;
          }
        }

        return { form, loading, saving, errors, submit };
      },
      template: `
        <div class="max-w-2xl mx-auto px-4 sm:px-6 py-6">
          <router-link :to="'/' + form.employee_id"
            class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-700 mb-6 group text-sm font-medium">
            <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
            返回详情
          </router-link>

          <div v-if="loading" class="flex justify-center py-24">
            <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full spin"></div>
          </div>

          <div v-else class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 sm:p-8">
            <div class="flex items-center gap-3 mb-8">
              <div class="w-11 h-11 bg-indigo-100 rounded-2xl flex items-center justify-center flex-shrink-0">
                <i class="fas fa-user-edit text-indigo-600"></i>
              </div>
              <div>
                <h1 class="text-xl font-bold text-slate-900">编辑员工信息</h1>
                <p class="text-slate-400 text-sm">ID: <span class="font-mono">{{ form.employee_id }}</span></p>
              </div>
            </div>

            <form @submit.prevent="submit" class="space-y-5">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    姓名 <span class="text-rose-500">*</span>
                  </label>
                  <input v-model="form.name" type="text" placeholder="姓名"
                    :class="['w-full px-4 py-3 rounded-xl border text-sm transition-all',
                      errors.name
                        ? 'border-rose-300 bg-rose-50 focus:ring-2 focus:ring-rose-400'
                        : 'border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent']">
                  <p v-if="errors.name" class="text-rose-500 text-xs mt-1.5 flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> {{ errors.name }}
                  </p>
                </div>
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    部门 <span class="text-rose-500">*</span>
                  </label>
                  <input v-model="form.dept" type="text" placeholder="部门"
                    :class="['w-full px-4 py-3 rounded-xl border text-sm transition-all',
                      errors.dept
                        ? 'border-rose-300 bg-rose-50 focus:ring-2 focus:ring-rose-400'
                        : 'border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent']">
                  <p v-if="errors.dept" class="text-rose-500 text-xs mt-1.5 flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> {{ errors.dept }}
                  </p>
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">职位</label>
                <input v-model="form.position" type="text" placeholder="职位"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
              </div>

              <div class="flex gap-3 pt-2">
                <router-link :to="'/' + form.employee_id"
                  class="flex-1 sm:flex-none px-6 py-3 rounded-xl border border-slate-200 text-slate-700 text-sm font-semibold hover:bg-slate-50 transition-colors text-center">
                  取消
                </router-link>
                <button type="submit" :disabled="saving"
                  class="flex-1 sm:flex-none px-8 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-sm font-semibold hover:opacity-90 disabled:opacity-60 flex items-center justify-center gap-2 transition-opacity shadow-md shadow-indigo-500/20">
                  <div v-if="saving" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full spin"></div>
                  {{ saving ? '保存中…' : '保存更改' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      `
    };

    // ═══════════════════════════════════════════════════
    //  Root App
    // ═══════════════════════════════════════════════════
    const App = {
      components: { Navbar, BottomNav, Toast, ConfirmModal },
      template: `
        <div class="min-h-screen bg-slate-50 pb-16 md:pb-0">
          <Navbar />
          <router-view v-slot="{ Component }">
            <transition name="fade" mode="out-in">
              <component :is="Component" />
            </transition>
          </router-view>
          <BottomNav />
          <Toast />
          <ConfirmModal />
        </div>
      `
    };

    // ═══════════════════════════════════════════════════
    //  Router
    // ═══════════════════════════════════════════════════
    const router = createRouter({
      history: createWebHashHistory(),
      routes: [
        { path: '/',                        name: 'dashboard',     component: Dashboard    },
        { path: '/new',                     name: 'new-employee',  component: NewEmployee  },
        { path: '/edit/:employee_id',       name: 'edit-employee', component: EditEmployee },
        { path: '/:employee_id',            name: 'view-employee', component: ViewEmployee }
      ],
      scrollBehavior: () => ({ top: 0 })
    });

    // ═══════════════════════════════════════════════════
    //  Mount
    // ═══════════════════════════════════════════════════
    createApp(App).use(router).mount('#app');
  </script>
</body>
</html>
